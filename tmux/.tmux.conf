set-option -g focus-events on # required for 'autoread'
# Vi mode for seamless navigation
set-window-option -g mode-keys vi

# Alacritty as default terminal
set-option -g default-terminal "alacritty"
set-option -sa terminal-overrides ',alacritty:RGB'
set -g default-command /opt/homebrew/bin/zsh
set -g default-shell /opt/homebrew/bin/zsh

set -s escape-time 0
set-option -g status-position top
set -g extended-keys always
# Set the interval for updating the status bar to 10 seconds
set -g status-interval 10

# don't exit when close a session
set-option -g detach-on-destroy off

# Enable setting titles for Tmux windows
set -g set-titles on
# Set the left side of the status bar to display the Starship prompt
set -g status-left '$(starship) '
# Set the right side of the status bar to display the current window index, hostname, and current directory
set -g status-right "#[fg=white]#I #[fg=yellow]#H #R"

bind-key r source-file ~/.tmux.conf \; display "Reloaded!"
set -g base-index 1

# required for nvim zen mode
set-option -g allow-passthrough on

# switch panes (copy-mode)
bind -T copy-mode-vi C-h      if-shell "${IS_VIM} || ${IS_FZF}" "send-keys C-h" "select-pane -L"
bind -T copy-mode-vi C-j      if-shell "${IS_VIM} || ${IS_FZF}" "send-keys C-j" "select-pane -D"
bind -T copy-mode-vi C-k      if-shell "${IS_VIM} || ${IS_FZF}" "send-keys C-k" "select-pane -U"
bind -T copy-mode-vi C-l      if-shell "${IS_VIM} || ${IS_FZF}" "send-keys C-l" "select-pane -R"
bind -T copy-mode    C-h      if-shell "${IS_VIM} || ${IS_FZF}" "send-keys C-h" "select-pane -L"
bind -T copy-mode    C-j      if-shell "${IS_VIM} || ${IS_FZF}" "send-keys C-j" "select-pane -D"
bind -T copy-mode    C-k      if-shell "${IS_VIM} || ${IS_FZF}" "send-keys C-k" "select-pane -U"
bind -T copy-mode    C-l      if-shell "${IS_VIM} || ${IS_FZF}" "send-keys C-l" "select-pane -R"

###############
#  COPY MODE  #
###############
# macOS clipboard integration
set -g set-clipboard on
set -g set-clipboard external
bind C-y copy-mode
bind y copy-mode
unbind p
bind p run-shell "pbpaste | tmux load-buffer -" \; paste-buffer  # Clipboard paste

# Copy mode with macOS pbcopy
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-no-clear 'pbcopy'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi / command-prompt -p '/' 'send-keys -X search-backward %1'
bind -T copy-mode-vi ? command-prompt -p '?' 'send-keys -X search-forward %1'

# scroll speed
bind -T copy-mode-vi WheelUpPane   send-keys -N 1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -N 1 -X scroll-down
bind -T copy-mode    WheelUpPane   send-keys -N 1 -X scroll-up
bind -T copy-mode    WheelDownPane send-keys -N 1 -X scroll-down
# Disable problematic terminal features
set -ga terminal-overrides ',*:Tc'
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'


####################
#  MOUSE BINDINGS  #
####################

bind -n DoubleClick1StatusLeft switch-client -n


# vim-like pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# forget the find window.  That is for chumps
bind -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

set -g mouse on
# Start windows and panes at 1, not 0
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Use Option/Alt for window switching
bind -n M-h previous-window
bind -n M-l next-window

# Resize panes with Command+Option+Arrow keys
bind -n M-C-Left resize-pane -L 5
bind -n M-C-Right resize-pane -R 5
bind -n M-C-Up resize-pane -U 5
bind -n M-C-Down resize-pane -D 5

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

set -g @catppuccin_flavour 'mocha'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '60'
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-strategy-nvim 'session'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'
# Window splitting
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind q confirm-before -p "kill-session #S? (y/n)" kill-session

